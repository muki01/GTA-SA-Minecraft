name: Feature request
description: A Minecraft feature, block, mob or idea for the GTA + Minecraft mix.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: "e.g. Zombies that come out at night in Los Santos"
    validations:
      required: true
  - type: textarea
    id: minecraft
    attributes:
      label: How does it work in Minecraft?
      description: If it is a Minecraft feature, how it behaves there (links to the Minecraft Wiki are welcome).
  - type: textarea
    id: gta
    attributes:
      label: How should it mix with GTA San Andreas?
      description: Optional, e.g. how it should react to cars, police or pedestrians.
